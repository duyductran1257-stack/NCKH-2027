<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Quản Trị Nghiên Cứu Khảo Sát AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #4F46E5; --bg: #F8FAFC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #0F172A; padding: 18px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 820px; background: #FFF; border-radius: 20px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        h1 { font-size: 1.55rem; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .action-banner { background: #EEF2FF; border: 2px solid #C7D2FE; border-radius: 14px; padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; color: #334155; }
        input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #CBD5E1; font-size: 0.95rem; outline: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: #FFF; }
        .btn-success { background: #059669; color: #FFF; }
        .source-item { background: #FFF; border: 1px solid #CBD5E1; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ Bảng Quản Trị Nghiên Cứu Khảo Sát AI</h1>
    <p style="color: #64748B; margin-bottom: 20px;">Chỉnh sửa kịch bản nghiên cứu và xuất bản tệp HTML cho người tham gia làm bài.</p>
    <div class="action-banner">
        <button class="btn btn-success" onclick="exportIndexHtml()">📦 Xuất Tệp index.html Người Trả Lời</button>
        <button class="btn btn-primary" onclick="exportExcel()">📥 Tải Dữ Liệu Excel</button>
    </div>
    <div style="background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; padding: 20px;">
        <div class="form-group">
            <label>Chọn câu hỏi:</label>
            <select id="task-select" onchange="loadTaskForm()"></select>
        </div>
        <div class="form-group">
            <label>Tiêu đề tình huống:</label>
            <input type="text" id="adm-title">
        </div>
        <div class="form-group">
            <label>Mô tả tình huống du lịch:</label>
            <textarea id="adm-desc" rows="3"></textarea>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Điểm A (0%):</label>
                <input type="text" id="adm-left">
            </div>
            <div class="form-group">
                <label>Điểm B (100%):</label>
                <input type="text" id="adm-right">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Sự thật khách quan:</label>
                <select id="adm-gt" onchange="autoSyncAi()">
                    <option value="0">Điểm A là ĐÚNG</option>
                    <option value="1">Điểm B là ĐÚNG</option>
                </select>
            </div>
            <div class="form-group">
                <label>Điều hướng AI:</label>
                <select id="adm-manip" onchange="autoSyncAi()">
                    <option value="correct">✅ AI Trả Lời ĐÚNG</option>
                    <option value="wrong">❌ AI Trả Lời SAI</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Văn bản lời khuyên AI hiển thị:</label>
            <textarea id="adm-advice" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>Điểm thanh trượt AI khuyến nghị (%):</label>
            <input type="number" id="adm-score" min="0" max="100">
        </div>
        <div class="form-group">
            <label>Nguồn kiểm chứng đối chiếu:</label>
            <div id="sources-wrapper"></div>
            <button class="btn" style="background: #E2E8F0; width: 100%;" onclick="addSourceInput()">➕ Thêm nguồn đối chiếu</button>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 18px;">
            <button class="btn btn-primary" style="flex: 1;" onclick="saveTask()">💾 Lưu Kịch Bản</button>
        </div>
    </div>
</div>
<script>
    let tasks = JSON.parse(localStorage.getItem('tasks_config')) || [
      {
        task_id: 1,
        scenario_title: "Tình huống 1: Lịch trình ngày thứ Hai tại Đà Lạt",
        description: "Bạn đang lên kế hoạch cho chuyến đi Đà Lạt vào thứ Hai và phân vân giữa 2 điểm đến: Ga Đà Lạt và Thung Lũng Tình Yêu. Hãy kéo thanh trượt để thể hiện sự ưu tiên của bạn.",
        left_label: "Ga Đà Lạt",
        right_label: "Thung Lũng Tình Yêu",
        ground_truth: 1,
        ai_manipulation_mode: "wrong",
        ai_prediction: 15,
        ai_advice_text: "Ga Đà Lạt mở cửa bình thường vào thứ Hai, rất thích hợp để check-in sớm. Khuyến nghị ưu tiên Ga Đà Lạt (mức 15%).",
        external_sources: [{ title: "Fanpage Ga Đà Lạt", url: "https://facebook.com", info: "Thông báo: Ga Đà Lạt tạm ngưng đón khách tham quan vào thứ Hai hàng tuần để bảo dưỡng kỹ thuật." }]
      }
    ];

    window.onload = populateSelect;
    function populateSelect() {
        const sel = document.getElementById('task-select');
        sel.innerHTML = "";
        tasks.forEach((t, i) => { sel.innerHTML += `<option value="${i}">ID ${t.task_id}: ${t.scenario_title}</option>`; });
        loadTaskForm();
    }
    function loadTaskForm() {
        const val = parseInt(document.getElementById('task-select').value || 0);
        const t = tasks[val];
        document.getElementById('adm-title').value = t.scenario_title;
        document.getElementById('adm-desc').value = t.description;
        document.getElementById('adm-left').value = t.left_label;
        document.getElementById('adm-right').value = t.right_label;
        document.getElementById('adm-gt').value = t.ground_truth;
        document.getElementById('adm-manip').value = t.ai_manipulation_mode || "correct";
        document.getElementById('adm-advice').value = t.ai_advice_text || "";
        document.getElementById('adm-score').value = t.ai_prediction;
        const wrapper = document.getElementById('sources-wrapper');
        wrapper.innerHTML = "";
        (t.external_sources || []).forEach(s => addSourceInput(s.title, s.url, s.info));
    }
    function addSourceInput(title="", url="", info="") {
        const wrapper = document.getElementById('sources-wrapper');
        const div = document.createElement('div');
        div.className = "source-item";
        div.innerHTML = `
            <input type="text" placeholder="Tên nguồn" value="${title}" class="src-title" style="margin-bottom:6px;">
            <input type="text" placeholder="URL liên kết" value="${url}" class="src-url" style="margin-bottom:6px;">
            <textarea placeholder="Nội dung kiểm chứng" class="src-info" rows="2">${info}</textarea>
        `;
        wrapper.appendChild(div);
    }
    function autoSyncAi() {
        const gt = parseInt(document.getElementById('adm-gt').value);
        const manip = document.getElementById('adm-manip').value;
        const isLeft = (manip === "correct") ? (gt === 0) : (gt === 1);
        const targetScore = isLeft ? 15 : 85;
        const targetName = isLeft ? document.getElementById('adm-left').value : document.getElementById('adm-right').value;
        document.getElementById('adm-score').value = targetScore;
        document.getElementById('adm-advice').value = `Dựa trên dữ liệu điểm đến, tôi khuyến nghị bạn nên ưu tiên ${targetName} (mức ${targetScore}%).`;
    }
    function saveTask() {
        const val = parseInt(document.getElementById('task-select').value || 0);
        const sources = [];
        document.querySelectorAll('.source-item').forEach(el => {
            sources.push({
                title: el.querySelector('.src-title').value,
                url: el.querySelector('.src-url').value,
                info: el.querySelector('.src-info').value
            });
        });
        tasks[val] = {
            task_id: tasks[val].task_id,
            scenario_title: document.getElementById('adm-title').value,
            description: document.getElementById('adm-desc').value,
            left_label: document.getElementById('adm-left').value,
            right_label: document.getElementById('adm-right').value,
            ground_truth: parseInt(document.getElementById('adm-gt').value),
            ai_manipulation_mode: document.getElementById('adm-manip').value,
            ai_advice_text: document.getElementById('adm-advice').value,
            ai_prediction: parseInt(document.getElementById('adm-score').value),
            external_sources: sources
        };
        localStorage.setItem('tasks_config', JSON.stringify(tasks));
        alert("Đã lưu kịch bản!");
    }
    function exportExcel() {
        const records = JSON.parse(localStorage.getItem('experiment_results')) || [];
        if (!records.length) return alert("Chưa có lượt trả lời nào!");
        const ws = XLSX.utils.json_to_sheet(records);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "KetQua");
        XLSX.writeFile(wb, "experiment_results.xlsx");
    }
    function exportIndexHtml() {
        const jsonStr = JSON.stringify(tasks, null, 2);
        const template = `<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khảo Sát Hành Trình Du Lịch AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4F46E5; --bg: #F8FAFC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #0F172A; padding: 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; background: #FFF; border-radius: 20px; padding: 22px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .progress-bar-container { width: 100%; height: 8px; background: #E2E8F0; border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 0.85rem; color: #64748B; font-weight: 700; margin-bottom: 14px; }
        .scenario-box { background: #F1F5F9; border-radius: 14px; padding: 16px; margin: 14px 0 18px 0; font-size: 1rem; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .opt-card { border-radius: 14px; padding: 12px 8px; text-align: center; }
        .opt-left { background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%); border: 2px solid #0284C7; color: #0369A1; }
        .opt-right { background: linear-gradient(135deg, #FFEDD5 0%, #FED7AA 100%); border: 2px solid #EA580C; color: #C2410C; }
        .slider-wrapper { margin: 20px 0 16px 0; }
        input[type=range] { width: 100%; height: 12px; border-radius: 6px; background: #CBD5E1; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); cursor: pointer; border: 3px solid #FFF; box-shadow: 0 4px 10px rgba(79,70,229,0.4); }
        .slider-val-badge { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-top: 8px; }
        .ai-chat-box { background: #F8FAFC; border: 2px solid #CBD5E1; border-left: 6px solid var(--primary); border-radius: 14px; padding: 16px; margin: 16px 0; }
        .verification-banner { background: linear-gradient(135deg, #FEF3C7 0%, #FFFBEB 100%); border: 2.5px solid #F59E0B; border-radius: 16px; padding: 16px; margin: 16px 0; }
        .source-card { background: #FFF; border: 1.5px solid #FDE68A; border-radius: 12px; padding: 12px; margin-top: 10px; }
        .likert-title { font-weight: 700; margin: 16px 0 10px 0; font-size: 0.95rem; }
        .likert-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .likert-opt { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; padding: 12px 14px; border-radius: 12px; cursor: pointer; font-size: 0.95rem; font-weight: 600; }
        .likert-opt.selected { background: #EEF2FF; border-color: var(--primary); color: var(--primary); font-weight: 700; }
        .btn-primary { width: 100%; background: var(--primary); color: #FFF; border: none; padding: 15px; font-size: 1.05rem; font-weight: 700; border-radius: 14px; cursor: pointer; }
        .error-msg { background: #FEE2E2; color: #B91C1C; padding: 12px; border-radius: 10px; font-weight: 700; display: none; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text">Tình huống 1</div>
    <h2 id="task-title" style="font-size: 1.35rem;">🏖️ Tình huống</h2>
    <div class="scenario-box" id="task-desc">...</div>
    <div id="step-1" style="display: none;">
        <h3>🎯 Bước 1: Bạn thích đi đâu hơn?</h3>
        <div class="options-grid" style="margin-top: 12px;">
            <div class="opt-card opt-left"><div style="font-size:0.75rem; font-weight:800;">⬅️ PHƯƠNG ÁN A</div><div id="left-label-1" style="font-weight:800; font-size:1.1rem;"></div></div>
            <div class="opt-card opt-right"><div style="font-size:0.75rem; font-weight:800;">PHƯƠNG ÁN B ➡️</div><div id="right-label-1" style="font-weight:800; font-size:1.1rem;"></div></div>
        </div>
        <div class="slider-wrapper">
            <input type="range" min="0" max="100" value="50" id="slider-d1" oninput="updateD1(this.value)">
            <div class="slider-val-badge" id="slider-d1-val">50%</div>
            <div id="slider-d1-info" style="text-align:center; font-weight:600; color:#475569; margin-top:6px; font-size:0.9rem;"></div>
        </div>
        <button class="btn-primary" onclick="goToStep(2)">Xác nhận & Nhận gợi ý từ Trợ lý AI 🤖</button>
    </div>
    <div id="step-2" style="display: none;">
        <div style="background:#EEF2FF; color:#3730A3; padding:10px; border-radius:10px; font-weight:600; text-align:center; margin-bottom:14px;" id="step-2-recap"></div>
        <h3>🤖 Lời khuyên của Trợ lý AI:</h3>
        <div class="ai-chat-box">
            <div id="ai-advice-display" style="font-size: 1.05rem; line-height: 1.6;"></div>
            <div style="margin-top:10px; font-weight:700;">👉 Trợ lý AI khuyên kéo mức: <span id="ai-score-display" style="color:#DC2626; font-size:1.3rem;"></span></div>
        </div>
        <div class="likert-title">🤔 Mức độ tin tưởng ban đầu vào AI là bao nhiêu? *(Bắt buộc chọn)*</div>
        <div class="likert-options" id="t1-group">
            <div class="likert-opt" onclick="setTrust('t1', 1, this)">😢 1 - Rất nghi ngờ / Không tin</div>
            <div class="likert-opt" onclick="setTrust('t1', 2, this)">🙁 2 - Hơi không tin</div>
            <div class="likert-opt" onclick="setTrust('t1', 3, this)">😐 3 - Bình thường / Nửa tin nửa ngờ</div>
            <div class="likert-opt" onclick="setTrust('t1', 4, this)">🙂 4 - Khá tin tưởng</div>
            <div class="likert-opt" onclick="setTrust('t1', 5, this)">🤩 5 - Hoàn toàn tin tưởng 100%</div>
        </div>
        <div class="error-msg" id="err-step-2">⚠️ Bạn vui lòng chọn cảm nhận tin tưởng vào AI!</div>
        <button class="btn-primary" onclick="goToStep(3)">Tiếp tục kiểm chứng thông tin & Chốt quyết định ➡️</button>
    </div>
    <div id="step-3" style="display: none;">
        <div class="verification-banner">
            <div style="color:#B45309; font-weight:800; font-size:1.05rem; margin-bottom:6px;">🔎 THÔNG TIN ĐỐI CHIẾU THỰC TẾ</div>
            <div id="sources-container"></div>
        </div>
        <h3>🏁 Quyết định cuối cùng của bạn:</h3>
        <div class="options-grid" style="margin-top: 10px;">
            <div class="opt-card opt-left"><b id="left-label-2"></b></div>
            <div class="opt-card opt-right"><b id="right-label-2"></b></div>
        </div>
        <div class="slider-wrapper">
            <input type="range" min="0" max="100" value="50" id="slider-d2" oninput="document.getElementById('slider-d2-val').innerText = this.value + '%'">
            <div class="slider-val-badge" id="slider-d2-val">50%</div>
        </div>
        <div class="likert-title">🌟 Sau khi đối chiếu, mức độ tin cậy vào AI của bạn là: *(Bắt buộc chọn)*</div>
        <div class="likert-options" id="t2-group">
            <div class="likert-opt" onclick="setTrust('t2', 1, this)">😢 1 - Rất nghi ngờ / Không tin</div>
            <div class="likert-opt" onclick="setTrust('t2', 2, this)">🙁 2 - Hơi không tin</div>
            <div class="likert-opt" onclick="setTrust('t2', 3, this)">😐 3 - Bình thường / Nửa tin nửa ngờ</div>
            <div class="likert-opt" onclick="setTrust('t2', 4, this)">🙂 4 - Khá tin tưởng</div>
            <div class="likert-opt" onclick="setTrust('t2', 5, this)">🤩 5 - Hoàn toàn tin tưởng 100%</div>
        </div>
        <div class="error-msg" id="err-step-3">⚠️ Bạn vui lòng đánh giá lại niềm tin vào AI sau khi đối chiếu!</div>
        <button class="btn-primary" onclick="submitFinal()">Lưu quyết định & Hoàn tất ➡️</button>
    </div>
    <div id="completed-view" style="display:none; text-align:center; padding: 40px 10px;">
        <h1 style="font-size:2.2rem; margin-bottom:12px;">🎉 Chúc Mừng!</h1>
        <p style="color:#64748B; font-size:1.05rem;">Ý kiến của bạn đã được ghi lại đầy đủ vào hệ thống!</p>
    </div>
</div>
<script>
    const tasks = ` + jsonStr + `;
    let currentIdx = 0;
    let d1Val = 50;
    let t1Val = null;
    let t2Val = null;
    let pId = "P_" + new Date().toISOString().replace(/\\D/g, '').slice(0, 14);

    window.onload = renderTask;
    function renderTask() {
        if (currentIdx >= tasks.length) {
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'none';
            document.getElementById('completed-view').style.display = 'block';
            return;
        }
        const t = tasks[currentIdx];
        document.getElementById('progress-text').innerText = 'Tình huống ' + (currentIdx + 1) + ' / ' + tasks.length;
        document.getElementById('progress-fill').style.width = ((currentIdx / tasks.length) * 100) + '%';
        document.getElementById('task-title').innerText = '🏖️ ' + t.scenario_title;
        document.getElementById('task-desc').innerText = t.description;
        document.getElementById('left-label-1').innerText = t.left_label;
        document.getElementById('right-label-1').innerText = t.right_label;
        document.getElementById('left-label-2').innerText = t.left_label;
        document.getElementById('right-label-2').innerText = t.right_label;
        d1Val = 50; t1Val = null; t2Val = null;
        document.getElementById('slider-d1').value = 50;
        updateD1(50);
        showStep(1);
    }
    function showStep(s) {
        document.getElementById('step-1').style.display = s === 1 ? 'block' : 'none';
        document.getElementById('step-2').style.display = s === 2 ? 'block' : 'none';
        document.getElementById('step-3').style.display = s === 3 ? 'block' : 'none';
        document.getElementById('err-step-2').style.display = 'none';
        document.getElementById('err-step-3').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function updateD1(v) { 
        d1Val = parseInt(v); 
        document.getElementById('slider-d1-val').innerText = d1Val + '%';
        const t = tasks[currentIdx];
        const info = document.getElementById('slider-d1-info');
        if (d1Val === 50) info.innerText = "⚖️ Đang ở mức 50%: Phân vân giữa 2 điểm";
        else if (d1Val < 50) info.innerText = "⬅️ Nghiêng về: " + t.left_label;
        else info.innerText = "➡️ Nghiêng về: " + t.right_label;
    }
    function goToStep(s) {
        const t = tasks[currentIdx];
        if (s === 2) {
            document.getElementById('step-2-recap').innerText = "Lựa chọn ban đầu: " + d1Val + "%";
            document.getElementById('ai-advice-display').innerText = t.ai_advice_text || "";
            document.getElementById('ai-score-display').innerText = t.ai_prediction + "%";
            showStep(2);
        } else if (s === 3) {
            if (t1Val === null) return document.getElementById('err-step-2').style.display = 'block';
            const sDiv = document.getElementById('sources-container');
            sDiv.innerHTML = "";
            (t.external_sources || []).forEach(src => {
                sDiv.innerHTML += '<div class="source-card"><b>📌 ' + src.title + '</b><p style="margin:4px 0;">' + src.info + '</p>' + (src.url ? '<a href="' + src.url + '" target="_blank" style="font-size:0.85rem; color:#92400E; font-weight:700;">🌐 Xem nguồn</a>' : '') + '</div>';
            });
            document.getElementById('slider-d2').value = d1Val;
            document.getElementById('slider-d2-val').innerText = d1Val + "%";
            showStep(3);
        }
    }
    function setTrust(type, val, el) {
        const group = document.getElementById(type === 't1' ? 't1-group' : 't2-group');
        Array.from(group.children).forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        if (type === 't1') t1Val = val; else t2Val = val;
    }
    function submitFinal() {
        if (t2Val === null) return document.getElementById('err-step-3').style.display = 'block';
        const t = tasks[currentIdx];
        const d2 = parseInt(document.getElementById('slider-d2').value);
        let woa = (t.ai_prediction !== d1Val) ? (d2 - d1Val) / (t.ai_prediction - d1Val) : 0;
        let records = JSON.parse(localStorage.getItem('experiment_results')) || [];
        records.push({
            "Mã Người": pId,
            "Tình Huống": t.task_id,
            "Quyết Định 1": d1Val,
            "AI Gợi Ý": t.ai_prediction,
            "Quyết Định 2": d2,
            "WoA": parseFloat(Math.max(-1, Math.min(1, woa)).toFixed(4)),
            "Niềm Tin T1": t1Val,
            "Niềm Tin T2": t2Val,
            "Đổi Niềm Tin": t2Val - t1Val,
            "Lần 1 Đúng": ((d1Val > 50 && t.ground_truth === 1) || (d1Val <= 50 && t.ground_truth === 0)) ? 1 : 0,
            "Lần 2 Đúng": ((d2 > 50 && t.ground_truth === 1) || (d2 <= 50 && t.ground_truth === 0)) ? 1 : 0,
            "AI Đúng": ((t.ai_prediction > 50 && t.ground_truth === 1) || (t.ai_prediction <= 50 && t.ground_truth === 0)) ? 1 : 0,
            "Kịch Bản AI": t.ai_manipulation_mode === "correct" ? "AI Đúng" : "AI Sai",
            "Thời Gian": new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('experiment_results', JSON.stringify(records));
        currentIdx++;
        renderTask();
    }
<\/script>
